name: AI资讯日报推送

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  push-brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run push script
        run: python feishu_daily_brief.py

      - name: Commit brief md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *_daily_brief.md || true
          git diff --staged --quiet || git commit -m "daily brief $(date -u -d 'now+8 hours' '+%Y-%m-%d')"
          git push
